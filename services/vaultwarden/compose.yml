services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - "${VAULTWARDEN_DATA_PATH}:/data"

    expose:
      - "80"

    networks:
      - proxy

    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
