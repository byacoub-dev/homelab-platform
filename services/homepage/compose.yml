services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage
    restart: unless-stopped

    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.home.arpa

    volumes:
      - /srv/appdata/homepage/config:/app/config

    networks:
      - proxy

networks:
  proxy:
    external: true
