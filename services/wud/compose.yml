services:
  wud:
    image: getwud/wud:9.1.0
    container_name: wud
    restart: unless-stopped

    ports:
      - "${WUD_BIND_ADDRESS}:${WUD_PORT}:3000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "${WUD_DATA_PATH}:/store"

    environment:
      TZ: "${TZ}"
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "true"
      WUD_WATCHER_LOCAL_CRON: "0 * * * *"

      # Authentication (required for WUD 9.x)
      WUD_AUTH_ADMIN_USER: "${WUD_AUTH_ADMIN_USER}"
      WUD_AUTH_ADMIN_PASSWORD: "${WUD_AUTH_ADMIN_PASSWORD}"
