services:
  ntfy:
    image: binwiederhier/ntfy:v2.27.0
    container_name: ntfy
    hostname: ntfy
    command: serve
    restart: unless-stopped
    init: true

    environment:
      TZ: "${TZ}"
      NTFY_BASE_URL: "${NTFY_BASE_URL}"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments

    volumes:
      - "${NTFY_DATA_PATH}/cache:/var/cache/ntfy"
      - "${NTFY_DATA_PATH}/data:/var/lib/ntfy"

    expose:
      - "80"

    networks:
      - proxy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q '\"healthy\":true' || exit 1"
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
