global
    log stdout format raw local0
    maxconn 128

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout http-request 10s

frontend docker_api
    bind :2375

    acl method_get method GET
    acl method_head method HEAD

    acl ping_path path_reg ^(/v[0-9]+\.[0-9]+)?/_ping$
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/version$
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/containers/json$
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/networks$
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-f0-9]+/(logs|json)$

    http-request allow if method_get ping_path
    http-request allow if method_head ping_path
    http-request allow if method_get read_path
    http-request deny

    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
