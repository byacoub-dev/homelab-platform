---
- name: Deploy Grafana to development hosts
  hosts: development
  become: true

  vars:
    grafana_admin_user: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_USER') | default('admin', true) }}"
    grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"

  pre_tasks:
    - name: Ensure Grafana admin password is provided
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length > 0
        fail_msg: "GRAFANA_ADMIN_PASSWORD must be set in the environment."

  roles:
    - grafana
