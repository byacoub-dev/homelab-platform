---
- name: Create ACME application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /srv/appdata/acme/config
    - /srv/appdata/acme/certs
    - /etc/homelab/secrets/acme

- name: Create ntfy secret directory
  ansible.builtin.file:
    path: /etc/homelab/secrets/ntfy
    state: directory
    owner: root
    group: root
    mode: "0700"

# Verify the existing ntfy access token without exposing its contents.
# The token is provisioned locally and must never be stored in Git.
- name: Check existing ntfy ACME token
  ansible.builtin.stat:
    path: /etc/homelab/secrets/ntfy/acme.token
  register: acme_ntfy_token
  no_log: true

- name: Require existing ntfy ACME token
  ansible.builtin.assert:
    that:
      - acme_ntfy_token.stat.isreg | default(false)
    fail_msg: "ntfy ACME token missing: provision acme.token securely before deployment."
  no_log: true

- name: Validate ntfy ACME token permissions
  ansible.builtin.assert:
    that:
      - acme_ntfy_token.stat.pw_name == 'root'
      - acme_ntfy_token.stat.gr_name == 'root'
      - acme_ntfy_token.stat.mode == '0600'
    fail_msg: "ntfy ACME token must be owned by root:root with permissions 0600."
  no_log: true

- name: Check existing netcup API secret
  ansible.builtin.stat:
    path: /etc/homelab/secrets/acme/netcup.env
  register: acme_secret
  no_log: true

- name: Require existing netcup API secret
  ansible.builtin.assert:
    that:
      - acme_secret.stat.isreg | default(false)
    fail_msg: "ACME secret missing: provision netcup.env securely before deployment."

- name: Validate netcup API secret permissions
  ansible.builtin.assert:
    that:
      - acme_secret.stat.pw_name == 'root'
      - acme_secret.stat.gr_name == 'root'
      - acme_secret.stat.mode == '0600'
    fail_msg: "ACME secret must be owned by root:root with permissions 0600."
  no_log: true

- name: Create ACME deployment directory
  ansible.builtin.file:
    path: /opt/homelab-platform/services/acme
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy ACME Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../services/acme/compose.yml"
    dest: /opt/homelab-platform/services/acme/compose.yml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Deploy ACME renewal script
  ansible.builtin.copy:
    src: acme-renew.sh
    dest: /usr/local/sbin/acme-renew.sh
    owner: root
    group: root
    mode: "0750"

- name: Deploy ACME systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - acme-renew.service
    - acme-renew.timer
  register: acme_systemd_units

- name: Reload systemd after unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: acme_systemd_units is changed

- name: Enable and start ACME renewal timer
  ansible.builtin.systemd_service:
    name: acme-renew.timer
    enabled: true
    state: started
  when: not ansible_check_mode
