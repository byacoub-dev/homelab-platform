---
- name: Create Grafana stack directory
  ansible.builtin.file:
    path: /srv/stacks/grafana
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Check whether Grafana database already exists
  ansible.builtin.stat:
    path: /srv/appdata/grafana/grafana.db
  register: grafana_db

- name: Restore Grafana appdata from pre-Proxmox backup
  ansible.builtin.copy:
    src: /mnt/core01-backups/pre-proxmox/appdata/grafana/
    dest: /srv/appdata/grafana/
    remote_src: true
    owner: "472"
    group: "472"
  when: not grafana_db.stat.exists

- name: Copy Grafana compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../services/grafana/compose.yml"
    dest: /srv/stacks/grafana/compose.yml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Check existing Grafana environment file
  ansible.builtin.stat:
    path: /srv/stacks/grafana/.env
  register: grafana_existing_env
  when: grafana_preserve_env | default(false) | bool

- name: Require existing Grafana environment file
  ansible.builtin.assert:
    that:
      - grafana_existing_env.stat.exists
      - grafana_existing_env.stat.isreg | default(false)
    fail_msg: "Cannot preserve Grafana environment: .env is missing."
  when: grafana_preserve_env | default(false) | bool

- name: Create Grafana environment file
  ansible.builtin.template:
    src: grafana.env.j2
    dest: /srv/stacks/grafana/.env
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  when: not (grafana_preserve_env | default(false) | bool)

- name: Deploy Grafana
  community.docker.docker_compose_v2:
    project_src: /srv/stacks/grafana
    state: present
