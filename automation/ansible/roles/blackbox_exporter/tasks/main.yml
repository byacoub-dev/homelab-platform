---
- name: Create Blackbox Exporter directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - /srv/stacks/blackbox-exporter
    - /srv/stacks/blackbox-exporter/certs

- name: Copy Blackbox Exporter configuration
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop:
    - src: "{{ playbook_dir }}/../../../services/blackbox-exporter/compose.yml"
      dest: /srv/stacks/blackbox-exporter/compose.yml
    - src: "{{ playbook_dir }}/../../../services/blackbox-exporter/blackbox.yml"
      dest: /srv/stacks/blackbox-exporter/blackbox.yml

- name: Copy Caddy root certificate
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../certs/caddy-root.crt"
    dest: /srv/stacks/blackbox-exporter/certs/caddy-root.crt
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Deploy Blackbox Exporter
  community.docker.docker_compose_v2:
    project_src: /srv/stacks/blackbox-exporter
    state: present
